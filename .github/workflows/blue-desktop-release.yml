# Build the Blue 「工作台」 Windows x64 and Mac Apple silicon products from this checkout and the Workbench
# release branch, qualify them, and publish them to the self-hosted release directory. Push a tag `blue-v<version>`.
# Windows ships unsigned; the Mac build is signed with a Developer ID certificate and notarized.
# Runs only in the private source repository; the release server accepts SFTP uploads from the
# dedicated `dsh-release` account, whose key and host key are repository secrets.
name: Blue desktop release

on:
  push:
    tags: ['blue-v*']

permissions:
  contents: read

concurrency:
  group: blue-desktop-release
  cancel-in-progress: false

env:
  RELEASES_URL: https://ai-engineering.yunyaoyun.cn:20124/dsh/releases/
  PLATFORM_URL: https://ai-engineering.yunyaoyun.cn:20124
  WORKBENCH_REPOSITORY: aiko-dsh-plugins/aiko-dsh-workbench
  WORKBENCH_REF: release/desktop-0.3.0
  RELEASE_HOST: 116.114.29.62
  RELEASE_PORT: '12223'

jobs:
  windows:
    if: github.repository == 'aiko-dsh-plugins/deepseek-harness-source'
    runs-on: windows-latest
    timeout-minutes: 150
    # Build steps run in PowerShell: Git Bash's GNU tar reads `D:\…` as a remote host, and the build
    # scripts call tar with Windows paths. Only the SFTP upload uses bash.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Allow long paths
        shell: bash
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.WORKBENCH_REPOSITORY }}
          ref: ${{ env.WORKBENCH_REF }}
          ssh-key: ${{ secrets.WORKBENCH_DEPLOY_KEY }}
          path: workbench
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#blue-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "stable releases need a plain version, got $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workbench=$(git -C workbench rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The app development skill (Workbench modules/app-kit) carries the DSH developer docs. Regenerate them from
      # the DSH checkout being released, so the skill always matches the DSH version inside the product. Workbench
      # branches without the generator only get a warning.
      - name: Sync the DSH developer docs into the app development skill
        working-directory: workbench
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path modules/app-kit/scripts/sync-dsh-docs.mjs) {
            node modules/app-kit/scripts/sync-dsh-docs.mjs "$env:GITHUB_WORKSPACE/harness"
          } else {
            Write-Output "::warning::modules/app-kit/scripts/sync-dsh-docs.mjs is missing on this Workbench branch; the app development skill ships without the DSH developer docs."
          }
      - name: Product inputs from the Workbench
        working-directory: workbench
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir modules/workdsh install --frozen-lockfile
          node scripts/prepare-desktop-products.mjs --output "$env:RUNNER_TEMP/product-inputs" `
            --releases "$env:RELEASES_URL" --platform "$env:PLATFORM_URL" --channel stable
      - name: Build DSH
        working-directory: harness
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build
      - name: Package the unsigned Windows installer
        working-directory: harness
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Content -Path apps/desktop/.env.windows -Value '# Unsigned self-hosted product build: the product names its own release feed.'
          corepack pnpm --dir apps/desktop run package:win:x64:unsigned `
            --product "$env:RUNNER_TEMP/product-inputs/blue.json" --build-version "${{ steps.version.outputs.version }}"
      - name: Qualify the packaged product
        working-directory: harness
        # The runner's TEMP is an 8.3 short path (`RUNNER~1`); qualification profiles live under TEMP.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $artifacts = "$PWD/apps/desktop/.desktop-build/products/blue/win-x64/unsigned-artifacts"
          corepack pnpm exec tsx apps/desktop/scripts/test-product-host.ts --installed "$artifacts/win-unpacked"
          node apps/desktop/scripts/test-product-admission.mjs --resources "$artifacts/win-unpacked/resources" `
            --main "$artifacts/win-unpacked/resources/app.asar/lib/main.js"
      - name: Stage release files
        working-directory: harness
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          corepack pnpm --dir apps/desktop run publish:product `
            --record "$PWD/apps/desktop/.desktop-build/products/blue/win-x64/unsigned-artifacts/win-x64-release.json" `
            --output "$env:RUNNER_TEMP/staging"
          Set-Content -Path "$env:RUNNER_TEMP/staging/sources.txt" -Value "workbench ${{ steps.version.outputs.workbench }}", "harness $env:GITHUB_SHA"
      # The release server keeps the published files; a full Actions artifact quota must not block publication.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: blue-${{ steps.version.outputs.version }}-win-x64
          path: ${{ runner.temp }}/staging
          retention-days: 30
      - name: Publish to the release server
        shell: bash
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
        run: harness/apps/desktop/scripts/publish-self-hosted.sh "$(cygpath -u "$RUNNER_TEMP")/staging" "${{ steps.version.outputs.version }}"
      - name: Keep packaging evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blue-packaging-evidence-${{ github.run_attempt }}
          path: |
            harness/apps/desktop/.desktop-build/packaging-runs
            harness/apps/desktop/.desktop-build/qualification
          if-no-files-found: ignore
          retention-days: 7

  macos:
    # Runs once the Apple signing and notarization secrets exist; set the repository variable MACOS_RELEASE to true then.
    if: github.repository == 'aiko-dsh-plugins/deepseek-harness-source' && vars.MACOS_RELEASE == 'true'
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.WORKBENCH_REPOSITORY }}
          ref: ${{ env.WORKBENCH_REF }}
          ssh-key: ${{ secrets.WORKBENCH_DEPLOY_KEY }}
          path: workbench
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#blue-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "stable releases need a plain version, got $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workbench=$(git -C workbench rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The app development skill (Workbench modules/app-kit) carries the DSH developer docs. Regenerate them from
      # the DSH checkout being released, so the skill always matches the DSH version inside the product. Workbench
      # branches without the generator only get a warning.
      - name: Sync the DSH developer docs into the app development skill
        working-directory: workbench
        run: |
          if [ -f modules/app-kit/scripts/sync-dsh-docs.mjs ]; then
            node modules/app-kit/scripts/sync-dsh-docs.mjs "$GITHUB_WORKSPACE/harness"
          else
            echo "::warning::modules/app-kit/scripts/sync-dsh-docs.mjs is missing on this Workbench branch; the app development skill ships without the DSH developer docs."
          fi
      # Artifacts cannot move between jobs while the Actions storage quota is full, so the Mac job prepares its own inputs.
      - name: Product inputs from the Workbench
        working-directory: workbench
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm --dir modules/workdsh install --frozen-lockfile
          node scripts/prepare-desktop-products.mjs --output "$RUNNER_TEMP/product-inputs" \
            --releases "$RELEASES_URL" --platform "$PLATFORM_URL" --channel stable
      - name: Build DSH
        working-directory: harness
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run build
      - name: Signing and notarization settings
        working-directory: harness
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          apple="$RUNNER_TEMP/apple"
          mkdir -p "$apple"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$apple/developer-id.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$apple/AuthKey.p8"
          # dotenv values are quoted with a quote character the value does not contain; secrets never reach the log.
          node - "$apple" <<'NODE'
          const { writeFileSync } = require('node:fs')
          const apple = process.argv[2]
          const quote = (name, value) => {
            if (value === undefined || value === '') throw new Error(`missing ${name}`)
            const mark = !value.includes("'") ? "'" : !value.includes('"') ? '"' : undefined
            if (mark === undefined || /[\r\n]/.test(value)) throw new Error(`${name} cannot be written to dotenv`)
            return `${name}=${mark}${value}${mark}`
          }
          const env = process.env
          writeFileSync('apps/desktop/.env.macos', [
            '# Signed and notarized self-hosted product build; the product names its own release feed.',
            quote('DSH_DESKTOP_MACOS_SIGNING_IDENTITY', env.MACOS_SIGNING_IDENTITY),
            quote('DSH_DESKTOP_MACOS_TEAM_ID', env.MACOS_TEAM_ID),
            quote('CSC_LINK', `${apple}/developer-id.p12`),
            quote('CSC_KEY_PASSWORD', env.MACOS_CERTIFICATE_PASSWORD),
            quote('APPLE_API_KEY', `${apple}/AuthKey.p8`),
            quote('APPLE_API_KEY_ID', env.APPLE_API_KEY_ID),
            quote('APPLE_API_ISSUER', env.APPLE_API_ISSUER),
          ].join('\n') + '\n', { mode: 0o600 })
          NODE
      - name: Package the signed Mac installer
        working-directory: harness
        run: |
          corepack pnpm --dir apps/desktop run package:mac:arm64 \
            --product "$RUNNER_TEMP/product-inputs/blue.json" --build-version "${{ steps.version.outputs.version }}"
      - name: Qualify the packaged product
        working-directory: harness
        run: |
          set -euo pipefail
          app="$PWD/apps/desktop/.desktop-build/products/blue/mac-arm64/artifacts/mac-arm64/$(node -p "require('$RUNNER_TEMP/product-inputs/blue.json').productName").app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          corepack pnpm exec tsx apps/desktop/scripts/test-product-host.ts --installed "$app/Contents"
      - name: Stage release files
        working-directory: harness
        run: |
          corepack pnpm --dir apps/desktop run publish:product \
            --record "$PWD/apps/desktop/.desktop-build/products/blue/mac-arm64/artifacts/mac-arm64-release.json" \
            --output "$RUNNER_TEMP/staging"
          printf 'workbench %s\nharness %s\n' "${{ steps.version.outputs.workbench }}" "$GITHUB_SHA" > "$RUNNER_TEMP/staging/sources.txt"
      - name: Publish to the release server
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
        run: harness/apps/desktop/scripts/publish-self-hosted.sh "$RUNNER_TEMP/staging" "${{ steps.version.outputs.version }}"
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple" harness/apps/desktop/.env.macos
      - name: Keep packaging evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blue-mac-packaging-evidence-${{ github.run_attempt }}
          path: |
            harness/apps/desktop/.desktop-build/packaging-runs
            harness/apps/desktop/.desktop-build/qualification
          if-no-files-found: ignore
          retention-days: 7
